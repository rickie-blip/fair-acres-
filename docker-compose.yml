services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fair_acres
      POSTGRES_USER: fair_acres
      POSTGRES_PASSWORD: fair_acres
    ports:
      - "5432:5432"
    volumes:
      - fair_acres_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fair_acres_minio:/data

volumes:
  fair_acres_pgdata:
  fair_acres_minio:

